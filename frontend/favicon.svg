<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <!-- Dark theme background -->
  <rect width="512" height="512" rx="110" fill="#0b0e13" />
  
  <!-- Flow lines in background -->
  <g stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#glow)">
    <!-- Flow paths connecting to rabbit -->
    <path d="M 120 256 H 200 L 230 220" />
    <path d="M 392 256 H 312 L 282 220" />
    <path d="M 150 350 H 220 L 240 310" />
    <path d="M 362 350 H 292 L 272 310" />
    <path d="M 160 180 H 220 L 230 200" />
    <path d="M 352 180 H 292 L 282 200" />
  </g>
  <!-- Flow nodes (dots) -->
  <g fill="#00f2fe" filter="url(#glow)">
    <circle cx="120" cy="256" r="10" />
    <circle cx="392" cy="256" r="10" />
    <circle cx="150" cy="350" r="10" />
    <circle cx="362" cy="350" r="10" />
    <circle cx="160" cy="180" r="10" />
    <circle cx="352" cy="180" r="10" />
  </g>
  
  <!-- White Rabbit Outline (Sleek & Stylized) -->
  <g filter="url(#glow)">
    <!-- Glowing Rabbit Head Path -->
    <path d="M 256 390 
             C 210 390, 190 350, 190 300 
             C 190 270, 170 210, 160 140 
             C 155 105, 175 80, 200 110 
             C 220 135, 235 180, 245 220 
             C 250 200, 262 200, 267 220 
             C 277 180, 292 135, 312 110 
             C 337 80, 357 105, 352 140 
             C 342 210, 322 270, 322 300 
             C 322 350, 302 390, 256 390 Z" 
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Glowing Nose/Mouth -->
    <path d="M 240 330 L 256 345 L 272 330" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing Eyes (stylized lines) -->
    <path d="M 215 285 Q 230 280 235 295" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M 297 285 Q 282 280 277 295" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
