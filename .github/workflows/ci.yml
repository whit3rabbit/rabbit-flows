name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Drift guards. Pure Node, no dependencies needed — the check scripts use only builtins.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer manifest + skill drift
        run: npm run check
      - name: Workflow runtime-rule lint
        run: python3 .claude/skills/dynamic-workflow-authoring/scripts/validate.py .claude/workflows --strict

  # recon self-checks. Blocking. The precise (tree-sitter) backend is the most-shipped path but was
  # exercised by NO automated gate before this job — stdlib-only CI is blind to call-graph/import
  # regressions that only show up on the precise backend (and to the backend-parity harness, which
  # needs both backends to compare). So run BOTH: stdlib (degraded) and the tree-sitter venv (precise).
  recon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/workflow-kit/skills/secure-review/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/workflow-kit/skills/secure-review/scripts/requirements.txt
      - name: recon tests — stdlib (degraded backend)
        run: python3 test_recon.py
      - name: recon tests — tree-sitter venv (precise backend + parity harness)
        run: |
          bash setup_venv.sh
          .venv/bin/python test_recon.py

  # Best-effort guard. `plugin validate` is believed to be an offline static check (no login, no API
  # key) but that is UNVERIFIED — the `check` job above is the reliable gate. Uses Anthropic's tested
  # install script, not the deprecated npm package; install.sh drops the binary in ~/.local/bin.
  validate-plugin:
    runs-on: ubuntu-latest
    continue-on-error: true # best-effort (see comment above); the `check` job is the blocking gate
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Confirm binary on PATH
        run: claude --version  # fails loudly if install.sh did not land it on $HOME/.local/bin
      - name: Validate plugin manifest
        run: claude plugin validate ./plugins/workflow-kit --strict
